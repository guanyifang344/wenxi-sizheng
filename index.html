<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#20594b"><meta name="description" content="温习综合复习网站：思政学习、Python 课堂刷题与各科错题本。">
  <title>温习 · 综合复习</title>
  <link rel="stylesheet" href="./styles.css?v=3.0">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <a class="brand" href="./" aria-label="温习首页"><span class="brand-mark">温</span><span>温习<small>一点一点，记得更牢</small></span></a>
      <div class="subject-switch"><label for="subject-select">当前学科</label><select id="subject-select"><option value="sizheng">思想道德与法治</option><option value="python">Python 入门</option></select></div>
      <div class="nav-caption">我的学习空间</div>
      <nav aria-label="主导航">
        <button class="nav-item active" data-nav="home"><span>◫</span>学习首页</button>
        <button class="nav-item" data-nav="review"><span>↻</span>到期复习<b id="due-badge">0</b></button>
        <button class="nav-item" data-nav="mistakes"><span>▤</span>错题本<b id="wrong-badge">0</b></button>
      </nav>
      <div class="sidebar-note"><span class="little-star">✳</span><p>不必一次记住所有。<br>每次回忆，都在进步。</p><small>思想道德与法治 · 2026 期中</small></div>
      <div class="storage-note"><span class="status-dot"></span>进度保存在此浏览器</div>
    </aside>
    <main id="main" tabindex="-1"><div class="loading">正在整理你的复习桌面…</div></main>
  </div>
  <div id="notice" role="status" class="notice" hidden></div>
  <noscript>请启用 JavaScript，以使用题库和自动保存功能。</noscript>
  <script type="module" src="./app.js?v=3.0"></script>
</body>
</html>
